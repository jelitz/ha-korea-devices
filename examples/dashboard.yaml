# 대시보드 예시 (sections 보기). 엔티티 ID는 각자 환경에 맞게 바꾸세요.
# 에어컨·세탁실 부분은 실제로 쓰는 설정입니다.
# 가습기 부분은 tuya/airmade-amh9902uv 의 설정 파일이 만드는 엔티티 기준이며, 이 카드 구성 그대로는 아직 써 보지 않았습니다.

# 보기 맨 위 배지: 에어컨 센서로 실내 온습도 표시
badges:
  - type: entity
    entity: sensor.geosil_seutaendeuhyeong_eeokeon_temperature
    name: 실내
    icon: mdi:thermometer
    show_name: true
  - type: entity
    entity: sensor.geosil_seutaendeuhyeong_eeokeon_humidity
    name: 습도
    icon: mdi:water-percent
    show_name: true

sections:
  - type: grid
    cards:
      - type: heading
        heading: 거실
      - type: tile
        entity: climate.geosil_seutaendeuhyeong_eeokeon
        name: 에어컨
        icon: mdi:air-conditioner
        state_content: [hvac_action, current_temperature]
        icon_tap_action: { action: toggle }
        features_position: bottom
        features:
          - type: climate-hvac-modes
            hvac_modes: [cool, dry, fan_only, auto, "off"]
          - type: target-temperature
        grid_options: { columns: 12 }
      # 가습기: 아이콘을 누르면 켜고 끄고, 슬라이더로 목표 습도
      - type: tile
        entity: humidifier.gaseubgi
        name: 가습기
        icon: mdi:air-humidifier
        state_content: [state, current_humidity]
        icon_tap_action: { action: toggle }
        features_position: bottom
        features:
          - type: target-humidity
        grid_options: { columns: 12 }
      # 분무 세기는 fan 엔티티의 속도(33/66/100%)로 들어온다
      - type: tile
        entity: fan.gaseubgi
        name: 분무 세기
        icon: mdi:spray
        features_position: bottom
        features:
          - type: fan-speed
        grid_options: { columns: 12 }
      - type: tile
        entity: switch.gaseubgi_uv_sterilization
        name: UV 살균
        vertical: true
        tap_action: { action: toggle }
        grid_options: { columns: 4 }
      - type: tile
        entity: switch.gaseubgi_sleep
        name: 수면
        vertical: true
        tap_action: { action: toggle }
        grid_options: { columns: 4 }
      - type: tile
        entity: switch.gaseubgi_turbo
        name: 터보
        vertical: true
        tap_action: { action: toggle }
        grid_options: { columns: 4 }

  - type: grid
    cards:
      - type: heading
        heading: 세탁실
      - type: tile
        entity: sensor.setagsil_setaggi_machine_state
        name: 세탁기
        icon: mdi:washing-machine
        vertical: true
        grid_options: { columns: 6 }
      - type: tile
        entity: sensor.setagsil_geonjogi_machine_state
        name: 건조기
        icon: mdi:tumble-dryer
        vertical: true
        grid_options: { columns: 6 }
      # 끝나는 시각은 돌고 있을 때만 보인다
      - type: tile
        entity: sensor.setagsil_setaggi_completion_time
        name: 세탁 끝
        icon: mdi:timer-sand
        vertical: true
        grid_options: { columns: 6 }
        visibility:
          - condition: state
            entity: sensor.setagsil_setaggi_machine_state
            state_not: stop
      # 기기에서 원격 제어를 켜 둔 동안만 시작·일시정지·정지 버튼을 보인다
      - type: tile
        entity: select.setagsil_setaggi
        name: 세탁기 제어
        icon: mdi:washing-machine
        features_position: bottom
        features:
          - type: select-options
        grid_options: { columns: 12 }
        visibility:
          - condition: state
            entity: binary_sensor.setagsil_setaggi_remote_control
            state: "on"
