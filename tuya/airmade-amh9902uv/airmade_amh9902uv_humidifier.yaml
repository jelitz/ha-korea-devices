name: Humidifier
products:
  - id: utoa6fsvsavogcb8
    manufacturer: Airmade
    model: AMH-9902UV
entities:
  - entity: humidifier
    class: humidifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 13
        type: integer
        name: humidity
        range:
          min: 45
          max: 95
        mapping:
          - step: 5
      - id: 14
        type: integer
        name: current_humidity
      - id: 101
        type: boolean
        name: mode
        mapping:
          - dps_val: false
            value: normal
          - dps_val: true
            value: auto
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 23
        type: string
        name: speed
        mapping:
          - dps_val: level_1
            value: 33
          - dps_val: level_2
            value: 66
          - dps_val: level_3
            value: 100
  - entity: switch
    translation_key: uv_sterilization
    category: config
    dps:
      - id: 16
        type: boolean
        name: switch
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
  - entity: switch
    name: Warm mist
    icon: "mdi:fire"
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: switch
    name: Turbo
    icon: "mdi:fan-plus"
    dps:
      - id: 104
        type: boolean
        name: switch
  - entity: switch
    translation_key: sleep
    category: config
    dps:
      - id: 108
        type: string
        name: switch
        mapping:
          - dps_val: "on"
            value: true
          - dps_val: "off"
            value: false
